name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**", "tauri/docs/**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust 检查与测试
    runs-on: windows-latest
    env:
      # rustc 1.98.0（windows-msvc）在「增量编译 + clippy + 已存在 test 产物」
      # 的组合下会 ICE（rustc_metadata/rmeta/encoder.rs: no entry found for key），
      # 与源码无关，可稳定复现于未改动的提交。CI 也吃不到增量编译的收益，
      # 直接关闭以消除随机失败。
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: 安装 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: 依赖安全审计（RustSec advisory db）
        run: cargo audit --file tauri/src-tauri/Cargo.lock
      - name: 格式检查
        run: cargo fmt --manifest-path tauri/src-tauri/Cargo.toml -- --check
      - name: Clippy（警告视为错误）
        run: cargo clippy --manifest-path tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 测试
        run: cargo test --manifest-path tauri/src-tauri/Cargo.toml

  web:
    name: 前端检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS 语法检查（无打包链，node --check 即可捕获断链/语法错误）
        run: |
          for f in tauri/ui/*.js; do
            node --check "$f"
          done
      - name: JS 单元测试（纯函数工具层）
        run: node --test tauri/ui/test/*.test.mjs
