[package]
name = "dsh-launcher"
version = "1.1.0"
description = "DSH 启动器 - DeepSeek Harness 图形界面一键启动器"
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-registry = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
